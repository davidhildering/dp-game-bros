<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Bro — Kleine games. Groot plezier.</title>
    <meta
      name="description"
      content="Game Bro — een collectie kleine browsergames. Speel Memory Car Lane en meer."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="logo" href="./index.html">
        <span class="logo-badge">GB</span>
        <span class="logo-text">Game&nbsp;Bro</span>
      </a>
    </header>

    <section class="hero">
      <div class="hero-inner">
        <h1>Kleine games.<br /><span class="accent">Groot plezier.</span></h1>
        <p>
          De games hier zijn verzonnen door Derek en Pieter, twee broers die
          samen kleine browsergames bouwen bij Game Bro. Geen installs, geen
          accounts. Gewoon tikken en spelen.
        </p>
        <a class="btn" href="#games">🎮 Speel nu</a>
      </div>
    </section>

    <main>
      <section id="games" class="games">
        <h2>Games</h2>
        <div id="game-grid" class="game-grid">
          <!-- cards rendered from games.json -->
        </div>
      </section>

    </main>

    <footer class="site-footer">
      <p>© <span id="year"></span> Game Bro, gemaakt met 🎮 en te veel koffie.</p>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
